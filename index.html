<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1630" />
    <meta name="description" content="Upcoming tour dates for the comedians I follow, on a map and in date order." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://comediantracker.com/" />
    <meta property="og:title" content="Comedian Tracker" />
    <meta property="og:description" content="Upcoming tour dates for the comedians I follow, on a map and in date order." />
    <meta property="og:image" content="https://comediantracker.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Comedian Tracker" />
    <meta name="twitter:description" content="Upcoming tour dates for the comedians I follow, on a map and in date order." />
    <meta name="twitter:image" content="https://comediantracker.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Comedian Tracker</title>
    <script>
      try {
        var theme = localStorage.getItem("comedian-tracker:theme");
        if (theme !== "light" && theme !== "dark") theme = "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
